<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Masuk · Pastrack</title>
    <link rel="stylesheet" href="/assets/vendor/gentelella/gentelella-4.2.0.css"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/gentelella-pastrack.css">
    <script src="/assets/feedback.js" defer></script><script src="/assets/login.js" defer></script>
<link rel="stylesheet" href="/assets/feedback.css">
</head>

<body class="login-page">
    <div class="login-brand">
        <span class="brandmark">p<span>•</span></span>pastrack.
    </div>
    <main class="login-card">
        <h1>Masuk</h1>
        <form id="login-form" action="/login" method="post">
            <label for="username">Username</label><input id="username" name="username" autocomplete="username" required
                maxlength="100"><label for="password">Password</label><input type="password" id="password"
                name="password" autocomplete="current-password" required maxlength="256">
            <p id="login-success" class="success" hidden>Password berhasil diubah. Silakan masuk dengan password baru.
            </p>
            <p id="login-error" class="error" hidden>Username atau password tidak sesuai.</p>
            <button class="button primary" type="submit">Masuk</button>
        </form>
    </main>
<dialog id="action-confirm" class="action-confirm" aria-labelledby="action-confirm-title" aria-describedby="action-confirm-message"><h2 id="action-confirm-title">Konfirmasi tindakan</h2><p id="action-confirm-message"></p><div class="confirm-actions"><button type="button" class="button" id="action-confirm-cancel">Batal</button><button type="button" class="button primary" id="action-confirm-accept">Lanjutkan</button></div></dialog>
</body>

</html>
